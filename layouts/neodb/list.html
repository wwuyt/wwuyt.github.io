{{- define "main" -}}
<article class="post-single">
  <header class="post-header">
    <h1 class="post-title">{{ .Title }}</h1>
    {{- with .Description -}}<div class="post-description">{{ . }}</div>{{- end -}}
  </header>
  <div class="post-content">{{ .Content }}</div>

  <h2>已看（示例）</h2>
  <div class="bangumi-grid">
    <a class="bangumi-card" href="https://neodb.social/movie/4HIDhJLY5xlWOTWDeI7OvA" target="_blank" rel="noopener">
      <img class="bangumi-cover" src="https://neodb.social/media/covers/2024/4/07/4xlWOTWDeI7OvA_xl.jpg" alt="千与千寻" loading="lazy">
      <div class="bangumi-info"><div class="bangumi-title">千与千寻</div><div class="bangumi-meta"><span class="bangumi-rate">10⭐</span><div class="bangumi-ep">2001</div></div></div>
    </a>
    <a class="bangumi-card" href="https://neodb.social/movie/2tocwRZcBlIw6iJJhvdRWA" target="_blank" rel="noopener">
      <img class="bangumi-cover" src="https://neodb.social/media/covers/2023/6/15/cBlIw6iJJhvdRWA_xl.jpg" alt="星际穿越" loading="lazy">
      <div class="bangumi-info"><div class="bangumi-title">星际穿越</div><div class="bangumi-meta"><span class="bangumi-rate">9⭐</span><div class="bangumi-ep">2014</div></div></div>
    </a>
    <a class="bangumi-card" href="https://neodb.social/movie/g9UuBqLRxvDokbFjxS5T1g" target="_blank" rel="noopener">
      <img class="bangumi-cover" src="https://neodb.social/media/covers/2024/1/26/xvDokbFjxS5T1g_xl.jpg" alt="流浪地球2" loading="lazy">
      <div class="bangumi-info"><div class="bangumi-title">流浪地球2</div><div class="bangumi-meta"><span class="bangumi-rate">8⭐</span><div class="bangumi-ep">2023</div></div></div>
    </a>
  </div>

  <div style="margin-top:40px;padding:16px;background:var(--code-bg,#f5f5f5);border-radius:8px;">
    <strong>📌 想接入你的真实数据？</strong>
    <ol style="margin:8px 0 0;padding-left:20px;">
      <li>登录 NeoDB → 设置 → 导出 → 下载 JSON 文件。</li>
      <li>把文件发给我或放进 <code>data/neodb_complete.json</code>，我会做成静态页面。</li>
      <li>或者申请 <a href="https://neodb.social/developer/" target="_blank" rel="noopener">NeoDB API Token</a>，做成前端实时版。</li>
    </ol>
  </div>
</article>
{{- end -}}
