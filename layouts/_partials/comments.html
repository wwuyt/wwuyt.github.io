{{- /* Twikoo 评论系统 */ -}}
{{- if and .Site.Params.comments (not .Params.disabledComments | default false) -}}
<div id="twikoo"></div>
<script src="https://registry.npmmirror.com/twikoo/1.7.15/files/dist/twikoo.min.js" crossorigin="anonymous"></script>
<script>
twikoo.init({
  envId: "{{ .Site.Params.twikoo.envId }}",
  el: "#twikoo",
  lang: "{{ .Site.Params.twikoo.lang }}"
})
</script>
{{- end -}}
