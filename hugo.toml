baseURL = 'https://wwuyt.github.io/'
locale = 'zh-cn'
title = '我的博客'
theme = 'PaperMod'
enableRobotsTXT = true
enableEmoji = true

[params]
  description = "个人随笔 · 日常照片 · 游戏 · 电影 · 动漫"
  author = "我"
  keywords = ["blog", "随笔", "照片", "游戏", "电影", "动漫"]
  neodbToken = ""  # 本地运行: HUGO_PARAMS_NEODBTOKEN="你的Token" hugo server
  bangumiToken = ""  # 本地运行: HUGO_PARAMS_BANGUMITOKEN="你的Token" hugo server

  ShowReadingTime = true
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowWordCount = true
  ShowRssButtonInSectionTermList = true
  UseHugoToc = true
  disableSpecial1stPost = false
  disableScrollToTop = false
  comments = true

[params.twikoo]
  envId = "https://jazzy-axolotl-6204fe.netlify.app/.netlify/functions/twikoo"
  lang = "zh-CN"

  [params.homeInfoParams]
    Title = "你好，欢迎来到我的博客"
    Content = "这里记录一些生活随笔、日常照片，还有最近在玩的游戏、看的电影和动漫。"

  [params.fuseOpts]
    isCaseSensitive = false
    shouldSort = true
    location = 0
    distance = 1000
    threshold = 0.4
    minMatchCharLength = 0
    keys = ["title", "permalink", "summary", "content"]

  [params.page]
    default = 10

[[menu.main]]
    identifier = "search"
    name = "搜索"
    url = "/search/"
    weight = 10
  [[menu.main]]
    identifier = "archives"
    name = "归档"
    url = "/archives/"
    weight = 20
  [[menu.main]]
    identifier = "tags"
    name = "标签"
    url = "/tags/"
    weight = 30
  [[menu.main]]
    identifier = "bangumi"
    name = "追番"
    url = "/bangumi/"
    weight = 35
  [[menu.main]]
    identifier = "neodb"
    name = "影视"
    url = "/neodb/"
    weight = 37
  [[menu.main]]
    identifier = "about"
    name = "关于"
    url = "/about/"
    weight = 40

[outputs]
  home = ["HTML", "RSS", "JSON"]

[languages]
  [languages.zh-cn]
    locale = 'zh-cn'
    label = '中文'
    title = '我的博客'
    weight = 1

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    noClasses = false
    lineNos = true
    lineNumbersInTable = true